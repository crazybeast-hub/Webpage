Have a question or recipe suggestion?
</p>


<form class="bg-white shadow-lg rounded-lg
p-8 mt-10">


<label class="block font-medium mb-2">
Name
</label>

<input type="text"
placeholder="Enter your name"
class="w-full border border-gray-300
rounded-md px-4 py-3 mb-5">

Email
</label>

placeholder="Enter your email"
class="w-full border border-gray-300
rounded-md px-4 py-3 mb-5">


<label class="block font-medium mb-2">

</label>

<textarea rows="5"
placeholder="Write your message"
class="w-full border border-gray-300
rounded-md px-4 py-3 mb-5"></textarea>


<button type="submit"
class="bg-orange-500 text-white
px-7 py-3 rounded-md
hover:bg-orange-600">

</button>
