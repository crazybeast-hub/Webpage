<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Features</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.a {
    color: blue;
    text-align: center;
    margin-top: 100px;
    font-size: x-large;
}

.features {
    display: flex;
    justify-content: center;
    gap: 200px;
    padding: 50px;
}

.features h2 {
    transition: 0.3s;
}

.features h2:hover {
    transform: translateY(-8px);
}

.a img {
    display: block;
    width: 600px;
    max-width: 90%;
    margin: 80px auto 0;

    animation: imageAnimation 1s ease;
    transition: 0.4s;
}

.a img:hover {
    transform: scale(1.03);
}

@keyframes imageAnimation {
    from {
        opacity: 0;
        transform: translateY(50px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {

    .features {
        flex-direction: column;
        align-items: center;
        gap: 25px;
    }

    .a img {
        margin-top: 40px;
    }

}

</style>

</head>


<body class="bg-yellow-100">




<nav class="w-full">

    <div class="max-w-6xl mx-auto px-6 py-5
                flex flex-col md:flex-row
                items-center justify-between gap-5">

            Space Ship
        </a>


        <div class="flex flex-col md:flex-row
                    items-center gap-4 md:gap-9">

               class="text-emerald-500 text-xl hover:text-red-500">

            <a href="features.html"
               class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                Features
            </a>

            <a href="about.html"
               class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                About
            </a>

            <a href="b.html"
               class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                Blog
            </a>

            <a href="c.html"
               class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                Contact
            </a>

        </div>

    </div>

</nav>




<div class="text-5xl font-bold text-center mt-10">

    <h1>Features</h1>

</div>




<div class="a">

    <div class="features">

        <h2>Easy to Download</h2>

</div>
