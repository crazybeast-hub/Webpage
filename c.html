<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        h1 {
            animation: fade 1s ease;
        }

        input,
        textarea,
        button {
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            transform: scale(1.02);
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-yellow-100">


    <!-- Navigation -->

    <nav class="w-full">

        <div class="max-w-6xl mx-auto px-6 py-5
                    flex flex-col md:flex-row
                    items-center justify-between gap-5">

            <a href="index.html" class="text-3xl font-bold">
                Space Ship
            </a>

            <div class="flex flex-col md:flex-row
                        items-center gap-4 md:gap-9">

                 <a href="portfolio.html" class="text-emerald-500 text-xl hover:text-red-500">
    Home
</a>   


                <a href="features.html"
                   class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                    Features
                </a>

                <a href="about.html"
                   class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                    About
                </a>

                <a href="b.html"
                   class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                    Blog
                </a>

                <a href="c.html"
                   class="text-emerald-500 text-xl hover:text-red-500 transition duration-300">
                    Contact
                </a>

            </div>

        </div>

    </nav>


    <!-- Contact -->

    <div class="text-center mt-10">

        <h1 class="text-5xl font-bold">
            Contact Us
        </h1>

        <p class="mt-4 text-lg">
            We would love to hear from you.
        </p>

    </div>


    <!-- Form -->

    <div class="max-w-xl mx-auto px-6 mt-10">

        <input type="text"
               placeholder="Your Name"
               class="w-full p-3 bg-white border rounded-md">

        <input type="email"
               placeholder="Your Email"
               class="w-full p-3 bg-white border rounded-md mt-4">

        <textarea
            placeholder="Your Address"
            rows="2"
            class="w-full p-3 bg-white border rounded-md mt-4"></textarea>

        <textarea
            placeholder="Your Suggestion"
            rows="3"
            class="w-full p-3 bg-white border rounded-md mt-4"></textarea>

        <div class="text-center">

            <button
                class="bg-yellow-500 px-6 py-3 rounded-md mt-5">
                Submit
            </button>

        </div>

    </div>

</body>

</html>
