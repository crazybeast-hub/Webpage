<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign UP</title>

<style>
body{
    background: rgb(86, 245, 195);
    font-size: larger;
}

h1{
    text-align: center;
    margin: 40px 0;
}

form{
    width: 400px;
    margin: auto;
}

.ab{
    align-items: center;
    margin: 15px 0;
}

.ab label{
    width: 140px;
    text-align: right;
    margin-right: 15px;
    
}

.ab input{
    width: 500px;
    height: 25px;
}

.btn{
    text-align: center;
    margin-top: 50px;
}

button{
    padding: 10px 20px;
    
}

 h1 {
        animation: fade 1s ease;
    }


@keyframes fade {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
</style>

</head>
<body>

<h1>Sign Up</h1>

<form>

    <div class="ab">
        <label>Name</label>
        <input type="text">
    </div>

    <div class="ab">
        <label>Email ID</label>
        <input type="email">
    </div>

    <div class="ab">
        <label>Phone Number</label>
        <input type="text">
    </div>

    <div class="ab">
        <label>Username</label>
        <input type="text">
    </div>

    <div class="ab">
        <label>Create Password</label>
        <input type="password">
    </div>

    <div class="ab">
        <label>Type Password Again</label>
        <input type="password">
    </div>

    <div class="btn">
        <button type="submit">Create Account</button>
    </div>

</form>

</body>
</html>
